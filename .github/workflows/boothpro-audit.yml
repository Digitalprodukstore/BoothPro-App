name: BoothPro Audit & Guard

on:
  push:
    branches: ["main", "ops/boothpro-audit-guard"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

concurrency:
  group: boothpro-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-audit:
    name: Static architecture audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run BoothPro audit
        env:
          BOOTHPRO_URL: https://booth-pro-app.vercel.app
        run: node audit/boothpro-audit.mjs

  browser-smoke:
    name: Browser smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: static-audit
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Smoke test production
        env:
          BOOTHPRO_URL: https://booth-pro-app.vercel.app
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const url = process.env.BOOTHPRO_URL;
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
          const errors = [];
          page.on('pageerror', e => errors.push('pageerror: '+e.message));
          page.on('console', m => { if(m.type()==='error') errors.push('console: '+m.text()); });
          await page.goto(url, {waitUntil:'networkidle',timeout:30000});
          await page.waitForTimeout(1500);
          const checks = await page.evaluate(() => ({
            title: document.title,
            stepPackage: !!document.querySelector('#step-package'),
            packageGrid: !!document.querySelector('#packageGrid'),
            packageButtons: document.querySelectorAll('#packageGrid button[data-package-id]').length,
            frameGrid: !!document.querySelector('#preFrameGrid'),
            paymentButton: !!document.querySelector('#toPaymentBtn'),
            cameraScreen: !!document.querySelector('#screenCapture'),
            resultScreen: !!document.querySelector('#screenResult')
          }));
          console.log(JSON.stringify({url,checks,errors},null,2));
          if(!checks.stepPackage || !checks.packageGrid || !checks.frameGrid || !checks.paymentButton) process.exit(2);
          if(errors.length) process.exit(3);
          await browser.close();
          NODE

  guard-report:
    name: Audit report
    runs-on: ubuntu-latest
    needs: [static-audit,browser-smoke]
    if: always()
    steps:
      - name: Write summary
        run: |
          echo "## BoothPro Audit & Guard" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Static audit: ${{ needs.static-audit.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Browser smoke: ${{ needs.browser-smoke.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Policy: audit-only; no automatic production patching" >> "$GITHUB_STEP_SUMMARY"
