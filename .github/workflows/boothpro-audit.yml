name: BoothPro Audit

on:
  push:
    branches: [main, audit-engine]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  static-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: audit/package.json
      - run: cd audit && npm install
      - run: node audit/static-audit.mjs

  browser-audit:
    runs-on: ubuntu-latest
    needs: static-audit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: audit/package.json
      - run: cd audit && npm install
      - run: cd audit && npx playwright install --with-deps chromium
      - run: node audit/browser-audit.mjs
        env:
          BOOTHPRO_URL: https://booth-pro-app.vercel.app
