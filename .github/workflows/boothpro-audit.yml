name: BoothPro Audit & Guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: boothpro-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Static + Deep + Browser + Production Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Static audit
        continue-on-error: true
        run: python3 tools/boothpro_audit.py | tee audit-console.txt

      - name: Deep structural audit
        continue-on-error: true
        run: python3 tools/boothpro_deep_audit.py | tee deep-audit-console.txt

      - name: Dashboard to Kiosk cloud sync audit
        continue-on-error: true
        run: python3 tools/boothpro_cloud_sync_audit.py | tee cloud-sync-console.txt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Start local kiosk
        run: |
          nohup python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/boothpro-http.log 2>&1 &
          sleep 2

      - name: Browser interaction audit
        continue-on-error: true
        run: node tools/boothpro_browser_audit.mjs

      - name: Release guard
        id: release_guard
        run: python3 tools/boothpro_guard.py

      - name: Automatic failure ticket
        if: steps.release_guard.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'BoothPro QA Guard failure - ' + context.ref;
            const q = 'repo:' + context.repo.owner + '/' + context.repo.repo + ' is:issue is:open in:title "BoothPro QA Guard failure"';
            const found = await github.rest.search.issuesAndPullRequests({q});
            if (!found.data.items.length) {
              const runUrl = context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId;
              const body = [
                'Automated BoothPro QA Guard failure.',
                '',
                'Run: ' + runUrl,
                'Commit: ' + context.sha,
                'Ref: ' + context.ref,
                '',
                'Review the QA artifact and fix the failing release gate.'
              ].join('\\n');
              await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo, title, body});
            }

      - name: PR failure comment
        if: steps.release_guard.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '⛔ BoothPro QA Guard blocked this PR. Review the failing QA artifact before merge.\\n\\nRun: ' + runUrl
            });

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boothpro-audit-evidence
          path: |
            audit-report.json
            audit-console.txt
            deep-audit-report.json
            deep-audit-console.txt
            boothpro-cloud-sync-report.json
            cloud-sync-console.txt
            boothpro-browser-report.json
            boothpro-browser-failure.png
            boothpro-browser.png
            boothpro-guard-result.json
            /tmp/boothpro-http.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Job summary
        if: always()
        run: |
          echo "## BoothPro Audit & Guard" >> "$GITHUB_STEP_SUMMARY"
          if [ -f audit-report.json ]; then
            python3 -c 'import json; d=json.load(open("audit-report.json")); s=d["summary"]; print("- Static FAIL:",s["fail"]); print("- Static WARN:",s["warn"]); print("- Static PASS:",s["pass"])' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f deep-audit-report.json ]; then
            python3 -c 'import json; d=json.load(open("deep-audit-report.json")); s=d["summary"]; print("- Deep FAIL:",s["fail"]); print("- Deep WARN:",s["warn"]); print("- Deep metrics:",len(d.get("metrics",{})))' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f boothpro-cloud-sync-report.json ]; then
            python3 -c 'import json; d=json.load(open("boothpro-cloud-sync-report.json")); s=d["summary"]; print("- Cloud Sync FAIL:",s["fail"]); print("- Cloud Sync PASS:",s["pass"])' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f boothpro-browser-report.json ]; then
            python3 -c 'import json; d=json.load(open("boothpro-browser-report.json")); print("- Browser:",d.get("status")); [print("  -",c["name"],c["pass"]) for c in d.get("checks",[])]' >> "$GITHUB_STEP_SUMMARY"
          fi
