name: BoothPro Route & Regression Guard

on:
  push:
    branches:
      - main
      - fix/react-migration-route-guard-2026-10-17
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  route-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify React/Vite application entry points
        run: |
          test -f index.html
          test -f src/main.tsx
          test -f src/App.tsx
          test -f src/components/kiosk/KioskRoot.tsx
          test -f src/components/kiosk/CaptureScreen.tsx
          test -f src/components/kiosk/EditorScreen.tsx
          test -f src/components/kiosk/SoftFileScreen.tsx
          test -f src/components/dashboard/DashboardModal.tsx
          grep -Fq 'src/main.tsx' index.html
          grep -Fq 'CaptureScreen' src/components/kiosk/KioskRoot.tsx
          grep -Fq 'getUserMedia' src/components/kiosk/CaptureScreen.tsx

      - name: Verify cloud configuration API contract
        run: |
          test -f api/session.js
          test -f src/services/storageService.ts
          grep -Fq '"source": "/api/config"' vercel.json
          grep -Fq '"destination": "/api/session?route=config"' vercel.json
          grep -Fq 'boothpro_operator_config' api/session.js
          grep -Fq 'BOOTHPRO_ADMIN_PIN' api/session.js
          grep -Fq 'loadOperatorConfigFromCloud' src/services/storageService.ts
          grep -Fq 'saveOperatorConfigToCloud' src/services/storageService.ts
          grep -Fq 'saveOperatorConfigToCloud' src/components/dashboard/DashboardModal.tsx

      - name: Verify soft-file and server-side delivery entry points remain present
        run: |
          test -f api/softfile.js
          test -f api/send-direct-media.js
          test -f src/services/deliveryService.ts
          test -f src/components/kiosk/SoftFileScreen.tsx

      - name: Verify no Pictlord references in runtime entry files
        run: |
          if grep -Rni --exclude-dir=.git 'pictlord' src api index.html; then
            echo 'FAIL: Pictlord reference detected in BoothPro runtime entry files.'
            exit 1
          fi

      - name: Report contract
        run: |
          echo 'PASS: React/Vite routes, kiosk capture, cloud-config API, and soft-file entry points are present.'
