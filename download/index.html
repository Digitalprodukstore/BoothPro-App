<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BOOTHPRO · Soft File</title><script src="https://cdn.tailwindcss.com"></script></head><body class="min-h-screen bg-slate-950 text-white"><main class="mx-auto max-w-md px-5 py-8"><div class="text-xs font-black tracking-[.2em] text-violet-400">BOOTHPRO</div><h1 class="mt-3 text-3xl font-black">Soft File Anda Siap</h1><p class="mt-2 text-sm leading-6 text-slate-400">Satu sesi berisi 3 file: foto final seperti hasil print, GIF loop, dan Live Session Video.</p><div id="status" class="mt-6 rounded-2xl border border-slate-800 bg-slate-900 p-4 text-sm text-slate-300">Memuat soft file…</div><section id="files" class="mt-4 space-y-3"></section></main><script>(async()=>{const sid=location.pathname.split('/').filter(Boolean).pop();const status=document.getElementById('status'),files=document.getElementById('files');if(!sid){status.textContent='Session ID tidak ditemukan.';return}try{const r=await fetch('/api/session?session='+encodeURIComponent(sid),{cache:'no-store'}),d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'Soft file tidak ditemukan.');const m=d.session||{};const rows=[['📸','Simpan Foto Hasil Print (PNG)',m.photo_url],['🎞️','Simpan Animasi GIF Loop',m.gif_url],['🎥','Simpan Video Live Session (MP4)',m.video_url]];files.innerHTML=rows.map(x=>x[2]?'<a href="'+x[2].replace(/"/g,'&quot;')+'" download target="_blank" rel="noopener" class="flex items-center gap-3 rounded-2xl border border-slate-800 bg-slate-900 p-4 hover:bg-slate-800"><span class="text-2xl">'+x[0]+'</span><span class="flex-1 font-bold text-sm">'+x[1]+'</span><span class="text-xs text-violet-300">Simpan</span></a>':'').join('');if(rows.some(x=>!x[2])){status.textContent='Bundle belum lengkap. BoothPro sedang menyelesaikan media sesi ini.'}else{status.className='mt-6 rounded-2xl border border-emerald-500/20 bg-emerald-500/10 p-4 text-sm text-emerald-300';status.textContent='✓ 3 soft file siap disimpan.'}}catch(e){status.className='mt-6 rounded-2xl border border-red-500/20 bg-red-500/10 p-4 text-sm text-red-300';status.textContent=e.message||'Gagal memuat soft file.'}})()</script></body></html>
