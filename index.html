<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PictHub Booth - Pro Photobooth Kiosk</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- GIF.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
    <!-- Midtrans Snap JS (Sandbox) -->
    <script type="text/javascript" src="https://app.sandbox.midtrans.com/snap/snap.js" data-client-key="SB-Mid-client-YOUR_CLIENT_KEY"></script>
    
    <style>
        @media print {
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; }
            #print-area { position: absolute; left: 0; top: 0; width: 100%; }
        }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-between font-sans">

    <!-- Header / Navbar -->
    <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <i class="fa-solid fa-camera-retro text-2xl text-indigo-400"></i>
            <h1 class="text-xl font-bold tracking-wide">PictHub <span class="text-indigo-400">Booth</span></h1>
        </div>
        <div class="flex gap-3">
            <button onclick="switchTab('booth')" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-lg text-sm font-semibold transition"><i class="fa-solid fa-camera mr-2"></i>Booth</button>
            <button onclick="switchTab('history')" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm font-semibold transition"><i class="fa-solid fa-images mr-2"></i>Riwayat</button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="container mx-auto px-4 py-6 flex-grow flex flex-col items-center justify-center">
        
        <!-- SECTION: PHOTOBOOTH -->
        <div id="sec-booth" class="w-full max-w-4xl flex flex-col items-center gap-6">
            <!-- Camera Viewport / Preview -->
            <div class="relative w-full aspect-video bg-black rounded-2xl overflow-hidden border-2 border-slate-700 shadow-2xl flex items-center justify-center">
                <video id="webcam" autoplay playsinline class="w-full h-full object-cover transform -scale-x-100"></video>
                <canvas id="photo-canvas" class="hidden"></canvas>

                <!-- Countdown Overlay -->
                <div id="countdown-overlay" class="absolute inset-0 bg-black/60 flex items-center justify-center hidden">
                    <span id="countdown-text" class="text-9xl font-extrabold text-white animate-ping">3</span>
                </div>
            </div>

            <!-- Controls -->
            <div class="flex flex-wrap gap-4 justify-center items-center w-full">
                <button id="btn-start" onclick="startCaptureProcess()" class="px-8 py-4 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-lg font-bold shadow-lg transition flex items-center gap-2">
                    <i class="fa-solid fa-circle-dot text-red-400 animate-pulse"></i> Mulai Foto
                </button>
                <button onclick="payWithMidtrans()" class="px-6 py-4 bg-amber-600 hover:bg-amber-500 text-white rounded-xl text-lg font-bold shadow-lg transition flex items-center gap-2">
                    <i class="fa-solid fa-credit-card"></i> Bayar & Mulai
                </button>
            </div>
        </div>

        <!-- SECTION: RESULT & PRINT -->
        <div id="sec-result" class="w-full max-w-4xl flex flex-col items-center gap-6 hidden">
            <h2 class="text-2xl font-bold text-indigo-400">Hasil Foto Anda</h2>
            <div id="print-area" class="bg-white p-4 rounded-lg shadow-2xl">
                <img id="final-result-img" class="max-h-[60vh] object-contain rounded" alt="Hasil Strip Foto" />
            </div>

            <div class="flex gap-4 flex-wrap justify-center">
                <button onclick="triggerPrint()" class="px-6 py-3 bg-blue-600 hover:bg-blue-500 rounded-xl font-bold transition flex items-center gap-2">
                    <i class="fa-solid fa-print"></i> Cetak Foto
                </button>
                <button onclick="exportGIF()" class="px-6 py-3 bg-purple-600 hover:bg-purple-500 rounded-xl font-bold transition flex items-center gap-2">
                    <i class="fa-solid fa-film"></i> Download GIF
                </button>
                <button onclick="resetBooth()" class="px-6 py-3 bg-slate-700 hover:bg-slate-600 rounded-xl font-bold transition">
                    <i class="fa-solid fa-rotate-left mr-2"></i>Foto Lagi
                </button>
            </div>
        </div>

        <!-- SECTION: HISTORY -->
        <div id="sec-history" class="w-full max-w-5xl hidden">
            <h2 class="text-2xl font-bold mb-4 text-indigo-400">Riwayat Foto (IndexedDB)</h2>
            <div id="history-grid" class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <!-- Data dari IndexedDB dimuat di sini -->
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-slate-800 border-t border-slate-700 py-3 text-center text-xs text-slate-400">
        &copy; 2026 PictHub Booth Pro Kiosk. All Rights Reserved.
    </footer>

    <!-- LOGIKA JAVASCRIPT PERBAIKAN LENGKAP -->
    <script>
        // -------------------------------------------------------------
        // 1. SYSTEM INITIALIZATION & INDEXEDDB MANAGEMENT
        // -------------------------------------------------------------
        const DB_NAME = 'PictHubBoothDB_v212';
        const DB_VERSION = 1;
        let capturedPhotos = [];
        let videoStream = null;

        function openDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains('history')) {
                        db.createObjectStore('history', { keyPath: 'id', autoIncrement: true });
                    }
                    if (!db.objectStoreNames.contains('frames')) {
                        db.createObjectStore('frames', { keyPath: 'id' });
                    }
                };
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        async function saveToHistory(base64Image) {
            try {
                const db = await openDB();
                const tx = db.transaction('history', 'readwrite');
                tx.objectStore('history').add({
                    image: base64Image,
                    timestamp: new Date().toLocaleString('id-ID')
                });
                console.log('Foto berhasil disimpan ke IndexedDB');
            } catch (err) {
                console.error('Gagal menyimpan ke IndexedDB:', err);
            }
        }

        async function loadHistory() {
            const grid = document.getElementById('history-grid');
            grid.innerHTML = '<p class="col-span-full text-center text-slate-400">Memuat riwayat...</p>';
            
            try {
                const db = await openDB();
                const tx = db.transaction('history', 'readonly');
                const store = tx.objectStore('history');
                const request = store.getAll();

                request.onsuccess = () => {
                    const records = request.result;
                    if (records.length === 0) {
                        grid.innerHTML = '<p class="col-span-full text-center text-slate-400">Belum ada riwayat foto.</p>';
                        return;
                    }

                    grid.innerHTML = records.reverse().map(item => `
                        <div class="bg-slate-800 p-2 rounded-lg border border-slate-700 flex flex-col gap-2">
                            <img src="${item.image}" class="w-full h-auto rounded" />
                            <span class="text-[10px] text-slate-400 text-center">${item.timestamp}</span>
                        </div>
                    `).join('');
                };
            } catch (err) {
                grid.innerHTML = '<p class="col-span-full text-center text-red-400">Gagal memuat riwayat.</p>';
            }
        }

        // -------------------------------------------------------------
        // 2. CAMERA & PHOTO CAPTURE LOGIC
        // -------------------------------------------------------------
        async function initCamera() {
            try {
                const video = document.getElementById('webcam');
                videoStream = await navigator.mediaDevices.getUserMedia({
                    video: { width: 1280, height: 720, facingMode: 'user' },
                    audio: false
                });
                video.srcObject = videoStream;
            } catch (err) {
                alert('Gagal mengosongkan/mengakses kamera: ' + err.message);
            }
        }

        function startCaptureProcess() {
            capturedPhotos = [];
            let photosToTake = 3;
            let currentCount = 0;

            const overlay = document.getElementById('countdown-overlay');
            const countdownText = document.getElementById('countdown-text');
            overlay.classList.remove('hidden');

            function takeNextPhoto() {
                let timer = 3;
                countdownText.innerText = timer;

                const interval = setInterval(() => {
                    timer--;
                    if (timer > 0) {
                        countdownText.innerText = timer;
                    } else {
                        clearInterval(interval);
                        captureFrame();
                        currentCount++;

                        if (currentCount < photosToTake) {
                            setTimeout(takeNextPhoto, 1000);
                        } else {
                            overlay.classList.add('hidden');
                            renderFinalStrip();
                        }
                    }
                }, 1000);
            }

            takeNextPhoto();
        }

        function captureFrame() {
            const video = document.getElementById('webcam');
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth || 1280;
            canvas.height = video.videoHeight || 720;
            const ctx = canvas.getContext('2d');
            
            // Mirroring horizontal
            ctx.translate(canvas.width, 0);
            ctx.scale(-1, 1);
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            capturedPhotos.push(canvas.toDataURL('image/png'));
        }

        // -------------------------------------------------------------
        // 3. CANVAS STRIP RENDERING & SVG FRAME FIX
        // -------------------------------------------------------------
        function renderFinalStrip() {
            const canvas = document.createElement('canvas');
            canvas.width = 600;
            canvas.height = 1800;
            const ctx = canvas.getContext('2d');

            // White Background
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Render Photos
            let loadedCount = 0;
            capturedPhotos.forEach((src, index) => {
                const img = new Image();
                img.onload = () => {
                    const yPos = 50 + (index * 520);
                    ctx.drawImage(img, 50, yPos, 500, 480);
                    loadedCount++;

                    if (loadedCount === capturedPhotos.length) {
                        // Draw Footer Text (Substitusi SVG Frame)
                        const countText = capturedPhotos.length + ' PHOTOS • 2026';
                        ctx.fillStyle = '#333333';
                        ctx.font = 'bold 24px sans-serif';
                        ctx.textAlign = 'center';
                        ctx.fillText('PictHub Booth', 300, 1680);
                        ctx.font = '16px sans-serif';
                        ctx.fillText(countText, 300, 1710);

                        const resultBase64 = canvas.toDataURL('image/png');
                        document.getElementById('final-result-img').src = resultBase64;
                        saveToHistory(resultBase64);

                        // Switch View
                        document.getElementById('sec-booth').classList.add('hidden');
                        document.getElementById('sec-result').classList.remove('hidden');
                    }
                };
                img.src = src;
            });
        }

        // -------------------------------------------------------------
        // 4. FIXED GIF.JS GENERATION (BLOB WORKER)
        // -------------------------------------------------------------
        async function exportGIF() {
            if (capturedPhotos.length === 0) return alert("Belum ada foto!");

            try {
                // Fetch Worker via Blob URL untuk menghindari CORS/Worker Construct Error
                const response = await fetch('https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js');
                const workerBlob = await response.blob();
                const workerUrl = URL.createObjectURL(workerBlob);

                const gif = new GIF({
                    workers: 2,
                    quality: 10,
                    workerScript: workerUrl,
                    width: 600,
                    height: 400
                });

                let loaded = 0;
                capturedPhotos.forEach(src => {
                    const img = new Image();
                    img.onload = () => {
                        gif.addFrame(img, { delay: 500 });
                        loaded++;
                        if (loaded === capturedPhotos.length) {
                            gif.render();
                        }
                    };
                    img.src = src;
                });

                gif.on('finished', function(blob) {
                    const gifUrl = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = gifUrl;
                    a.download = 'picthub-booth-animation.gif';
                    a.click();
                    URL.revokeObjectURL(workerUrl);
                });

            } catch (err) {
                alert("Gagal membuat GIF: " + err.message);
            }
        }

        // -------------------------------------------------------------
        // 5. MIDTRANS PAYMENT INTEGRATION (BACKEND SECURE API)
        // -------------------------------------------------------------
        async function payWithMidtrans() {
            try {
                // Panggil Endpoint Backend Anda yang Aman
                const res = await fetch('/api/create-transaction', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ amount: 25000 })
                });

                if (!res.ok) throw new Error("Gagal terhubung ke server pembayaran.");

                const data = await res.json();
                
                if (window.snap) {
                    window.snap.pay(data.token, {
                        onSuccess: function(result) {
                            alert("Pembayaran Berhasil!");
                            startCaptureProcess();
                        },
                        onPending: function(result) {
                            alert("Menunggu Pembayaran...");
                        },
                        onError: function(result) {
                            alert("Pembayaran Gagal!");
                        }
                    });
                } else {
                    alert("Midtrans SDK belum terpasang/Client Key belum diatur.");
                }
            } catch (err) {
                alert("Sistem Payment Demo: " + err.message + "\n\n(Akan langsung memulainya tanpa bayar untuk preview)");
                startCaptureProcess();
            }
        }

        // -------------------------------------------------------------
        // 6. UTILITIES & KIOSK PRINTING
        // -------------------------------------------------------------
        function triggerPrint() {
            window.print();
        }

        function resetBooth() {
            capturedPhotos = [];
            document.getElementById('sec-result').classList.add('hidden');
            document.getElementById('sec-booth').classList.remove('hidden');
        }

        function switchTab(tab) {
            if (tab === 'booth') {
                document.getElementById('sec-booth').classList.remove('hidden');
                document.getElementById('sec-result').classList.add('hidden');
                document.getElementById('sec-history').classList.add('hidden');
            } else if (tab === 'history') {
                document.getElementById('sec-booth').classList.add('hidden');
                document.getElementById('sec-result').classList.add('hidden');
                document.getElementById('sec-history').classList.remove('hidden');
                loadHistory();
            }
        }

        // Window Load Initialization
        window.addEventListener('DOMContentLoaded', () => {
            initCamera();
        });
    </script>
</body>
</html>
