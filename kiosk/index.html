<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BoothPro Kiosk</title></head><body><div style="font-family:system-ui;padding:24px">Memuat BoothPro Kiosk…</div><script>
(async()=>{
try{
 const r=await fetch('/index-legacy.html?bp-kiosk='+Date.now(),{cache:'no-store'});
 if(!r.ok) throw new Error('BoothPro Kiosk gagal dimuat ('+r.status+')');
 let html=await r.text();
 const guard=String.raw`<script id="bp-kiosk-entry-guard">
(function(){
 'use strict';
 window.__BP_ENTRY_MODE__='kiosk';
 function forceKiosk(){
   try{
     if(typeof closeDashboard==='function') closeDashboard();
     var modal=document.getElementById('dashboardModal');
     if(modal){modal.classList.add('hidden');modal.style.display='none';modal.setAttribute('aria-hidden','true');}
     if(typeof resetToHome==='function') resetToHome();
     document.querySelectorAll('[id^="step-"]').forEach(function(el){ if(el.id==='step-welcome') el.classList.remove('hidden'); else el.classList.add('hidden'); });
   }catch(e){}
 }
 setTimeout(forceKiosk,0);
 setTimeout(forceKiosk,100);
 setTimeout(forceKiosk,500);
 setTimeout(forceKiosk,1500);
})();
<\/script>`;
 const at=html.toLowerCase().lastIndexOf('</body>');
 if(at<0) throw new Error('BoothPro Kiosk tidak memiliki body penutup');
 html=html.slice(0,at)+guard+html.slice(at);
 document.open();document.write(html);document.close();
}catch(e){document.body.innerHTML='<pre style="padding:24px;color:#fca5a5">'+String(e&&e.stack||e).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))+'</pre>'}
})();
</script></body></html>
