<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BoothPro Kiosk</title></head><body><div style="font-family:system-ui;padding:24px">Memuat BoothPro Kiosk…</div><script>
(async()=>{
try{
 const r=await fetch('/index-legacy.html?bp-kiosk='+Date.now(),{cache:'no-store'});
 if(!r.ok) throw new Error('BoothPro Kiosk gagal dimuat ('+r.status+')');
 let html=await r.text();
 const kioskCss=String.raw`<style id="bp-kiosk-hard-isolation">#dashboardModal,#dashboardAuthModal{display:none!important;visibility:hidden!important;pointer-events:none!important}</style>`;
 html=html.replace(/<\\/head>/i,kioskCss+"<\\/head>");
 const guard=String.raw`<script id="bp-kiosk-entry-guard">
(function(){
 'use strict';
 window.__BP_ENTRY_MODE__='kiosk';
 function blockDashboard(){
   try{
     if(typeof closeDashboard==='function') closeDashboard();
     if(typeof closeDashboardAuth==='function') closeDashboardAuth();
     var modal=document.getElementById('dashboardModal');
     if(modal){modal.classList.add('hidden');modal.style.display='none';modal.setAttribute('aria-hidden','true');}
     var auth=document.getElementById('dashboardAuthModal');
     if(auth){auth.classList.add('hidden');auth.style.display='none';auth.setAttribute('aria-hidden','true');}
   }catch(e){}
 }
 function forceKioskInitial(){
   try{
     blockDashboard();
     if(typeof resetToHome==='function') resetToHome();
     document.querySelectorAll('[id^="step-"]').forEach(function(el){ if(el.id==='step-welcome') el.classList.remove('hidden'); else el.classList.add('hidden'); });
   }catch(e){}
 }
 window.openDashboard=function(){ blockDashboard(); return false; };
 window.openDashboardUnlocked=function(){ blockDashboard(); return false; };
 window.openDashboardAuth=function(){ blockDashboard(); return false; };
 forceKioskInitial();
 setTimeout(blockDashboard,100);
 setTimeout(blockDashboard,500);
 setTimeout(blockDashboard,1500);
 setInterval(function(){
   try{
     if(typeof window.openDashboard!=='function' || !window.openDashboard.__bpKioskBlocked){
       var f=function(){ blockDashboard(); return false; }; f.__bpKioskBlocked=true; window.openDashboard=f;
     }
     if(typeof window.openDashboardUnlocked!=='function' || !window.openDashboardUnlocked.__bpKioskBlocked){
       var u=function(){ blockDashboard(); return false; }; u.__bpKioskBlocked=true; window.openDashboardUnlocked=u;
     }
     if(typeof window.openDashboardAuth!=='function' || !window.openDashboardAuth.__bpKioskBlocked){
       var a=function(){ blockDashboard(); return false; }; a.__bpKioskBlocked=true; window.openDashboardAuth=a;
     }
     blockDashboard();
   }catch(e){}
 },500);
})();
<\/script>`;
 const at=html.toLowerCase().lastIndexOf('</body>');
 if(at<0) throw new Error('BoothPro Kiosk tidak memiliki body penutup');
 html=html.slice(0,at)+guard+html.slice(at);
 document.open();document.write(html);document.close();
}catch(e){document.body.innerHTML='<pre style="padding:24px;color:#fca5a5">'+String(e&&e.stack||e).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))+'</pre>'}
})();
</script></body></html>
