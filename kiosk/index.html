<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="cache-control" content="no-cache">
<title>BoothPro Kiosk</title>
</head>
<body>
<script>
(async function(){
  'use strict';
  try{
    const url='/index-legacy.html?bp-kiosk=1';
    const res=await fetch(url,{cache:'no-store'});
    if(!res.ok)throw new Error('Kiosk engine HTTP '+res.status);
    let html=await res.text();
    const marker='<scr'+'ipt src="/boothpro-hotfix-c9.js?c9=1"><\/scr'+'ipt>';
    const c10='<scr'+'ipt src="/boothpro-hotfix-c10.js?c10=2"><\/scr'+'ipt>';
    if(!html.includes('boothpro-hotfix-c10.js')){
      if(html.includes(marker)) html=html.replace(marker,marker+'\n'+c10);
      else html=html.replace('</body>',c10+'\n</body>');
    }
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.body.innerHTML='<main style="font-family:system-ui;padding:24px"><h1>BoothPro Kiosk gagal dimuat</h1><p>'+String(e?.message||e).replace(/[<>]/g,'')+'</p><button onclick="location.reload()">Muat ulang</button></main>';
  }
})();
</script>
<noscript><a href="/index-legacy.html?bp-kiosk=1">Buka BoothPro Kiosk</a></noscript>
</body>
</html>
