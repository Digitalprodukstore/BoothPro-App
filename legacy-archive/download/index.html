<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BOOTHPRO · Soft File</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script></head><body class="min-h-screen bg-slate-950 text-white"><main class="mx-auto max-w-md px-5 py-8"><div class="text-xs font-black tracking-[.2em] text-violet-400">BOOTHPRO</div><h1 class="mt-3 text-3xl font-black">Soft File Anda Siap</h1><p id="hello" class="mt-2 text-sm leading-6 text-slate-400">Foto, GIF, dan Live Session Video dalam satu sesi.</p><div id="status" class="mt-6 rounded-2xl border border-slate-800 bg-slate-900 p-4 text-sm text-slate-300">Memuat soft file…</div><button id="zip" disabled class="mt-4 w-full rounded-2xl bg-violet-600 px-5 py-4 font-black disabled:opacity-40">⬇ Download Semua File (ZIP)</button><section id="files" class="mt-5 space-y-3"></section></main><script>(async()=>{const qs=new URLSearchParams(location.search);const sid=String(qs.get('id')||qs.get('session')||decodeURIComponent(location.pathname.split('/').filter(Boolean).pop()||'')).trim(),$=id=>document.getElementById(id),status=$('status'),zipBtn=$('zip'),files=$('files');let session;try{const r=await fetch('/api/session?session='+encodeURIComponent(sid),{cache:'no-store'}),d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'Session tidak ditemukan.');session=d.session;$('hello').textContent='Halo '+(session.customer_name||'Pelanggan')+', semua soft file Anda siap disimpan.';const rows=[['📸','Foto Hasil Print (PNG)',session.photo_url],['🎞️','Animasi GIF Loop',session.gif_url],['🎥','Live Session Video',session.video_url]];files.innerHTML=rows.map(x=>x[2]?'<a href="'+x[2].replace(/"/g,'&quot;')+'" download class="flex items-center gap-3 rounded-2xl border border-slate-800 bg-slate-900 p-4"><span class="text-2xl">'+x[0]+'</span><span class="flex-1 text-sm font-bold">'+x[1]+'</span><span class="text-xs text-violet-300">Simpan</span></a>':'').join('');if(rows.every(x=>x[2])){zipBtn.disabled=false;status.className='mt-6 rounded-2xl border border-emerald-500/20 bg-emerald-500/10 p-4 text-sm text-emerald-300';status.textContent='✓ 3 file siap. Download ZIP akan mengambil ketiganya di background.'}else status.textContent='Bundle belum lengkap.'}catch(e){status.className='mt-6 rounded-2xl border border-red-500/20 bg-red-500/10 p-4 text-sm text-red-300';status.textContent=e.message||'Gagal memuat soft file.'}zipBtn.onclick=async()=>{if(!session)return;zipBtn.disabled=true;zipBtn.textContent='Menyiapkan ZIP…';status.textContent='Mengambil 3 file secara paralel…';try{const entries=[['Foto-Hasil-Print.png',session.photo_path],['Animasi-GIF.gif',session.gif_path],['Live-Session-Video.mp4',session.video_path]];const blobs=await Promise.all(entries.map(async([name,url])=>{const r=await fetch(url);if(!r.ok)throw new Error('Gagal mengambil '+name);return [name,await r.blob()]}));const z=new JSZip();blobs.forEach(([name,b])=>z.file(name,b));const out=await z.generateAsync({type:'blob',compression:'STORE'});saveAs(out,'boothpro-'+sid+'.zip');status.textContent='✓ ZIP berhasil dibuat dan siap diunduh.'}catch(e){status.textContent='Gagal membuat ZIP · '+(e.message||e)}finally{zipBtn.disabled=false;zipBtn.textContent='⬇ Download Semua File (ZIP)'}}})()</script></body></html>
